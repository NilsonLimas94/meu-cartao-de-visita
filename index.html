<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Cartão de Visita - Nilson Limas Junior</title>
</head>
<body>
    <main>
        <!--Cabeçalho - Foto, título, subtitulo e skills-->
        <div class="cabecalho">
            <div class="avatar-box">
                <div class="borda-giratoria"></div>
                    <img class="img-avatar" src="./Assets/avatar.jpg" alt="Imagem do avatar">
            </div>
            <div class="nome-subtitulo-skills">
                <h1>Nilson Limas Junior</h1>
                <h3>Desenvolvedor FullStack</h3>
                <div class="skills">
                    <span class="skill-html">HTML</span>
                    <span class="skill-css">CSS</span>
                    <span class="skill-js">JS</span>
                </div>
            </div>
        </div> 

        <div class="divisor"></div>

        <!-- Informações pessoais -->
        <div class="email-localizacao">
            <div class="email">
                <div class="icone-email">
                    <img src="./Assets/e-mail.png" alt="icone do email">
                </div>
                <p>nilsonlimasjunior@gmail.com</p>
            </div>
            <div class="localizacao">
                <div class="icone-localizacao">
                    <img src="./Assets/localizacao.png" alt="icone de localicação">
                </div>
                <p>Cariacica, Espírito Santo, Brasil</p>
            </div>
        </div>

        <div class="divisor"></div>

        <!-- Mídias -->
         <div class="midias-sociais">
            <button>
                <a href="#">
                    <img src="./Assets/github.png" alt="icone do github">
                    GitHub
                </a>
            </button>
            <button>
                <a href="#">
                    <img src="./Assets/linkedin.png" alt="icone do linkedin">
                    LinkedIn
                </a>
            </button>
            <button>
                <a href="#">
                    <img src="./Assets/instagram.png" alt="icone do instagram">
                    Instagram
                </a>
            </button>
         </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
